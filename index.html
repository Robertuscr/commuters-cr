<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vecinos de Ciudad Real que trabajan fuera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Colores de La Tribuna de Ciudad Real */
  --marca:#3d6a8e;      /* azul de la cabecera */
  --tinta:#1c3347;      /* azul noche */
  --suave:#eef2f6;      /* fondo claro */
  --acento:#f0b44c;     /* flujos */
  --alerta:#c0392b;     /* Urda */
  --linea:#d3dde6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Archivo,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--suave);color:var(--tinta)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.hero{background:var(--tinta);color:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--marca) 0,transparent 70%);opacity:.55}
.big{font-weight:900;font-size:clamp(46px,9vw,84px);line-height:.9;letter-spacing:-2px;position:relative;z-index:1}
.big small{display:block;font-size:15px;font-weight:600;letter-spacing:0;opacity:.75;margin-top:8px}
.ctrls{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--marca);border-color:var(--marca)}
.years{display:flex;align-items:center;gap:6px}
.years button{font:inherit;font-weight:800;font-size:14px;background:rgba(255,255,255,.08);border:0;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
.years button.on{background:#fff;color:var(--tinta)}
.years .play{background:var(--acento);color:var(--tinta);width:34px}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--linea)}
svg{display:block;width:100%;height:auto}
.muni{stroke:#fff;stroke-width:.6;cursor:pointer;transition:fill .5s}
.muni:hover{stroke:var(--tinta);stroke-width:1.5}
.muni.sel{stroke:var(--tinta);stroke-width:2.2}
.prov{fill:#e6ebf0;stroke:#c3cfdb;stroke-width:1}
.flow{fill:none;stroke:var(--acento);stroke-linecap:round;opacity:.82;stroke-dasharray:3 7;animation:run 1.4s linear infinite;pointer-events:none}
.flow.inv{animation-direction:reverse}
.flow.sel{stroke:var(--alerta);opacity:1}
@keyframes run{to{stroke-dashoffset:-20}}
.rail{fill:none;stroke:var(--tinta);stroke-width:3;stroke-dasharray:10 5;opacity:.75}
.lbl{font-weight:800;font-size:15px;fill:var(--tinta)}
.lbl.s{font-size:12px;font-weight:600}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-top:6px;flex-wrap:wrap}
.legend .bar{height:10px;flex:1;min-width:120px;border-radius:5px}
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border:2px solid var(--linea);border-radius:12px;outline:none}
.search:focus{border-color:var(--marca)}
.fname{font-weight:900;font-size:28px;margin:14px 0 2px;line-height:1.05}
.tag{display:inline-block;background:var(--tinta);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--suave);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1}
.kpi span{font-size:12px;font-weight:600;opacity:.75}
.kpi.hot{background:var(--marca);color:#fff}
.kpi.hot span{opacity:.9}
.sub{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:16px 0 6px;opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--suave);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.chip b{font-weight:900}
.rank{list-style:none;counter-reset:r}
.rank li{display:grid;grid-template-columns:22px 140px 1fr 48px;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:3px 0;cursor:pointer}
.rank li:before{counter-increment:r;content:counter(r);font-weight:900;opacity:.45}
.rank .rb{height:14px;border-radius:4px;background:var(--acento);position:relative}
.rank .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank li.sel .rb{background:var(--marca);color:#fff}
.rank .v{text-align:right;font-weight:900}
.nd{font-size:14px;font-weight:600;opacity:.6;padding:10px 0}
.tip{position:fixed;pointer-events:none;background:var(--tinta);color:#fff;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:opacity .15s;z-index:9}
.tip b{font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="big"><span id="bigN">0</span><small id="bigL"></small></div>
    <div class="ctrls">
      <div class="seg" id="views"></div>
      <div class="years" id="years"></div>
    </div>
  </div>
  <div class="grid">
    <div class="card">
      <svg id="map"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <input class="search" id="q" list="ml" placeholder="Busca tu municipio" autocomplete="off">
      <datalist id="ml"></datalist>
      <div id="ficha"></div>
      <div class="sub" id="rkT"></div>
      <ol class="rank" id="rk"></ol>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

const Y=DATA.Y, M=DATA.M;
const VIEWS={
  mad:{b:'Madrid capital',k:'mad',big:'vecinos de la provincia trabajan en Madrid capital',to:'madrid',inv:false,share:true},
  cm:{b:'Comunidad de Madrid',k:'cm',big:'vecinos de la provincia trabajan en la Comunidad de Madrid',to:'madrid',inv:false,share:true},
  inv:{b:'De Madrid a aquí',k:'inv',big:'vecinos de la Comunidad de Madrid trabajan en la provincia',to:'madrid',inv:true,share:false}
};
let view='mad', yi=3, sel='034', playing=null;
const fmt=n=>n==null?'–':String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const SV='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(SV,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const map=document.getElementById('map');
map.setAttribute('viewBox',`0 0 ${GEO.W} ${GEO.H}`);
GEO.provs.filter(p=>p.id!=='13').forEach(p=>el('path',{d:p.d,class:'prov'},map));
const gM=el('g',{},map), gF=el('g',{},map), gR=el('g',{},map), gL=el('g',{},map);
const P={};const pt=GEO.pts;
GEO.munis.forEach(f=>{P[f.id]=el('path',{d:f.d,class:'muni','data-id':f.id},gM);P[f.id].c=f.c});
el('polyline',{points:GEO.rail.map(p=>p.join(',')).join(' '),class:'rail'},gR);[['cr','Ciudad Real',-88,-8],['pt','Puertollano',-84,16]].forEach(([k,t,dx,dy])=>{el('circle',{cx:pt[k][0],cy:pt[k][1],r:5,fill:'#fff',stroke:'var(--tinta)','stroke-width':2.5},gR);const x=el('text',{x:pt[k][0]+dx,y:pt[k][1]+dy,class:'lbl s'},gR);x.textContent=t;x.style.paintOrder='stroke';x.style.stroke='#fff';x.style.strokeWidth='3px'});
[['madrid','Madrid',10,-8],['toledo','Toledo',10,4]].forEach(([k,t,dx,dy])=>{el('circle',{cx:pt[k][0],cy:pt[k][1],r:7,fill:'var(--tinta)'},gL);const x=el('text',{x:pt[k][0]+dx,y:pt[k][1]+dy,class:'lbl'},gL);x.textContent=t});
const u=pt.urda;el('path',{d:`M${u[0]-7},${u[1]-7}L${u[0]+7},${u[1]+7}M${u[0]+7},${u[1]-7}L${u[0]-7},${u[1]+7}`,stroke:'var(--alerta)','stroke-width':4,'stroke-linecap':'round'},gL);
const ut=el('text',{x:u[0]+12,y:u[1]+5,class:'lbl s',fill:'var(--marca)'},gL);ut.textContent='Urda';ut.style.fill='var(--alerta)';
// colores
const ramp=['#e3ecf3','#bcd0e0','#8fb0ca','#5e8bb0','#3d6a8e','#1c3347'];
function col(t){t=Math.max(0,Math.min(1,t));const i=t*(ramp.length-1),a=Math.floor(i),b=Math.min(ramp.length-1,a+1),f=i-a;
  const h=s=>[1,3,5].map(j=>parseInt(s.substr(j,2),16));const A=h(ramp[a]),B=h(ramp[b]);return `rgb(${A.map((v,j)=>Math.round(v+(B[j]-v)*f)).join(',')})`}
const val=(c,k,i)=>M[c][k][i];
const share=(c,k,i)=>{const v=val(c,k,i),o=M[c].occ[i];return v!=null&&o?v/o:null};
function maxOver(k){let m=0;for(const c in M)M[c][k].forEach(v=>{if(v>m)m=v});return m}
function shareMax(k){let m=0;for(const c in M)for(let i=0;i<4;i++){const s=share(c,k,i);if(s!=null&&M[c].occ[i]>=1000&&s>m)m=s}return m}
// vistas y años
const vEl=document.getElementById('views');
for(const k in VIEWS){const b=document.createElement('button');b.textContent=VIEWS[k].b;b.onclick=()=>{view=k;draw()};b.dataset.k=k;vEl.appendChild(b)}
const yEl=document.getElementById('years');
const pb=document.createElement('button');pb.className='play';pb.textContent='▶';pb.onclick=play;yEl.appendChild(pb);
Y.forEach((y,i)=>{const b=document.createElement('button');b.textContent=y;b.onclick=()=>{stop();yi=i;draw()};b.dataset.i=i;yEl.appendChild(b)});
function play(){if(playing){stop();return}pb.textContent='❚❚';yi=0;draw();playing=setInterval(()=>{if(yi>=3){stop();return}yi++;draw()},1300)}
function stop(){clearInterval(playing);playing=null;pb.textContent='▶'}
// contador
let shown=0;
function count(to){const from=shown,t0=performance.now();shown=to;const n=document.getElementById('bigN');
  (function s(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);n.textContent=fmt(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(s)})(t0)}
function curve(a,b,inv){const [x1,y1]=inv?b:a,[x2,y2]=inv?a:b;const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,o=L*.18;
  return `M${x1},${y1}Q${mx-dy/L*o},${my+dx/L*o} ${x2},${y2}`}
function draw(){
  const V=VIEWS[view],k=V.k;
  vEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===view));
  yEl.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i===yi));
  let tot=0;for(const c in M)tot+=val(c,k,yi)||0;
  const totals={mad:DATA.S[Y[yi]].mad,cm:DATA.S[Y[yi]].mad+DATA.S[Y[yi]].rcm,inv:DATA.S[Y[yi]].inv};
  count(totals[view]);
  document.getElementById('bigL').textContent=`${V.big} (${Y[yi]})`;
  const vmax=maxOver(k),smax=V.share?shareMax(k):0;
  for(const c in M){const p=P[c];let f='#f3f5f7';
    if(V.share){const s=share(c,k,yi);if(s!=null)f=col(Math.sqrt(s/smax))}
    else{const v=val(c,k,yi);if(v!=null)f=col(Math.sqrt(v/vmax))}
    p.style.fill=f;p.classList.toggle('sel',c===sel)}
  gF.innerHTML='';
  const arr=Object.keys(M).filter(c=>val(c,k,yi)).sort((a,b)=>val(b,k,yi)-val(a,k,yi));
  arr.forEach(c=>{const v=val(c,k,yi);el('path',{d:curve(P[c].c,pt[V.to],V.inv),class:'flow'+(V.inv?' inv':'')+(c===sel?' sel':''),'stroke-width':(Math.sqrt(v/vmax)*16+.7).toFixed(1)},gF)});
  legend(V,smax,vmax);ficha();ranking(arr);
}
function legend(V,smax,vmax){const L=document.getElementById('legend');
  const stops=ramp.map((c,i)=>`${c} ${i/(ramp.length-1)*100}%`).join(',');
  const hi=V.share?(smax*100).toFixed(1).replace('.',',')+'% de sus ocupados':fmt(vmax)+' trabajadores';
  L.innerHTML=`<span>0</span><span class="bar" style="background:linear-gradient(90deg,${stops})"></span><span>${hi}</span><span style="opacity:.6">· gris: sin dato</span>`}
function ranking(arr){const V=VIEWS[view],k=V.k;
  document.getElementById('rkT').textContent=`Los diez con más ${view==='inv'?'trabajadores llegados de la Comunidad de Madrid':'vecinos trabajando en '+V.b.toLowerCase().replace('comunidad','Comunidad').replace('madrid','Madrid').replace('toledo','Toledo')}`;
  const top=arr.slice(0,10),mx=val(top[0],k,yi);const R=document.getElementById('rk');R.innerHTML='';
  top.forEach(c=>{const li=document.createElement('li');li.className=c===sel?'sel':'';
    li.innerHTML=`<span class="nm">${M[c].n.replace(/^(.*), (La|El|Los|Las)$/,'$2 $1')}</span><div><div class="rb" style="width:${Math.max(3,val(c,k,yi)/mx*100)}%"></div></div><span class="v">${fmt(val(c,k,yi))}</span>`;
    li.onclick=()=>pick(c);R.appendChild(li)})}
function rankOf(c,k,i){const v=val(c,k,i);if(v==null)return null;let r=1;for(const d in M){const w=val(d,k,i);if(w!=null&&w>v)r++}return r}
function spark(c,k){const s=M[c][k],mx=Math.max(1,...s.filter(v=>v!=null));
  return `<svg viewBox="0 0 440 96">${s.map((v,i)=>{const h=v==null?0:v/mx*50;const x=i*110+10;
    return `<rect x="${x}" y="${74-h}" width="90" height="${h}" rx="7" fill="${i===yi?'var(--marca)':'var(--acento)'}"/><text x="${x+45}" y="93" text-anchor="middle" font-size="15" font-weight="700">${Y[i]}</text><text x="${x+45}" y="${68-h}" text-anchor="middle" font-size="17" font-weight="900">${v==null?'–':fmt(v)}</text>`}).join('')}</svg>`}
function ficha(){const V=VIEWS[view],k=V.k,d=M[sel],v=d[k][yi],o=d.occ[yi];const F=document.getElementById('ficha');
  let h=`<div class="fname">${d.n}</div>${d.avant?'<span class="tag">Corredor del Avant</span>':''}`;
  if(v==null){h+=`<div class="nd">El INE no publica dato para este municipio en esta vista (menos de cinco trabajadores por destino).</div>`}
  else{const r=rankOf(sel,k,yi);const one=V.share&&o?Math.round(o/v):null;
    h+=`<div class="kpis"><div class="kpi hot"><b>${fmt(v)}</b><span>${view==='inv'?'vecinos de la Comunidad de Madrid trabajan aquí':'vecinos trabajan en '+(view==='mad'?'Madrid capital':'la Comunidad de Madrid')}</span></div>
    <div class="kpi"><b>${one?'1 de '+one:'nº '+r}</b><span>${one?'de sus ocupados':'en la provincia'}</span></div>
    ${one?`<div class="kpi"><b>nº ${r}</b><span>de la provincia en número</span></div>`:''}
    ${view!=='inv'&&d.inv[yi]!=null?`<div class="kpi"><b>${fmt(d.inv[yi])}</b><span>vecinos de la Comunidad de Madrid trabajan aquí</span></div>`:''}</div>`;
    h+=`<div class="sub">Evolución</div>${spark(sel,k)}`}
  if(d.dest.length&&view!=='inv'){h+=`<div class="sub">Dónde trabajan fuera de la provincia (2024)</div><div class="chips">${d.dest.map(([p,n])=>`<span class="chip">${p==='Madrid'?'Comunidad de Madrid':p.replace('Valencia/Valéncia','Valencia').replace('Alicante/Alacant','Alicante')} <b>${fmt(n)}</b></span>`).join('')}</div>`}

function pick(c){sel=c;document.getElementById('q').value='';draw()}

const names=Object.keys(M).map(c=>[c,M[c].n]).sort((a,b)=>a[1].localeCompare(b[1],'es'));
document.getElementById('ml').innerHTML=names.map(([c,n])=>`<option value="${n}">`).join('');
